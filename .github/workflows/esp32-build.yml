name: ESP32 Firmware CI Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-esp32-firmware:
    name: Build ESP32 Firmware (ESP-IDF v5.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build Firmware with Espressif ESP-IDF v5.3 Container
        run: |
          echo "Launching Espressif ESP-IDF v5.3 build environment..."
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace/firmware/esp32 \
            -e "GIT_CONFIG_COUNT=1" \
            -e "GIT_CONFIG_KEY_0=safe.directory" \
            -e "GIT_CONFIG_VALUE_0=*" \
            espressif/idf:v5.3 \
            bash -c "set -o pipefail && idf.py build 2>&1 | tee /workspace/firmware/esp32/build_compiler.log"

      - name: Verify and list build artifacts
        run: |
          echo "=========================================="
          echo "ESP32 FIRMWARE BUILD ARTIFACTS VERIFICATION"
          echo "=========================================="
          ls -lah firmware/esp32/build/
          echo "Checking binary files..."
          test -f firmware/esp32/build/smart_parking_esp32.bin && echo "[OK] smart_parking_esp32.bin exists"
          test -f firmware/esp32/build/smart_parking_esp32.elf && echo "[OK] smart_parking_esp32.elf exists"
          test -f firmware/esp32/build/smart_parking_esp32.map && echo "[OK] smart_parking_esp32.map exists"
          test -f firmware/esp32/build/flasher_args.json && echo "[OK] flasher_args.json exists"
          test -f firmware/esp32/build/bootloader/bootloader.bin && echo "[OK] bootloader.bin exists"
          test -f firmware/esp32/build/partition_table/partition-table.bin && echo "[OK] partition-table.bin exists"
          test -f firmware/esp32/build_compiler.log && echo "[OK] build_compiler.log exists"
          echo "=========================================="
          cat firmware/esp32/build/flasher_args.json
          echo "=========================================="

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: |
            firmware/esp32/build/smart_parking_esp32.bin
            firmware/esp32/build/smart_parking_esp32.elf
            firmware/esp32/build/smart_parking_esp32.map
            firmware/esp32/build/flasher_args.json
            firmware/esp32/build/bootloader/bootloader.bin
            firmware/esp32/build/partition_table/partition-table.bin
            firmware/esp32/build_compiler.log
          if-no-files-found: error

  regression-tests:
    name: Full System Regression Tests (Backend, Vision & Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install opencv-python numpy pytest httpx anyio

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
