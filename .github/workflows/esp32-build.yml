name: ESP32 Firmware CI Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-esp32-firmware:
    name: Build ESP32 Firmware (ESP-IDF v5.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build Firmware with Espressif ESP-IDF v5.3 Container
        run: |
          echo "Launching Espressif ESP-IDF v5.3 build environment as root user..."
          docker run --rm --user root \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace/firmware/esp32 \
            -e "GIT_CONFIG_COUNT=1" \
            -e "GIT_CONFIG_KEY_0=safe.directory" \
            -e "GIT_CONFIG_VALUE_0=*" \
            espressif/idf:v5.3 \
            bash -c "set -eo pipefail && \
              echo '=== 1/2: Building Production Firmware (Hardware Mode - Fail-Safe Strict) ===' && \
              idf.py build 2>&1 | tee /workspace/firmware/esp32/build_compiler_prod.log && \
              esptool.py --chip esp32 merge_bin -o /workspace/firmware/esp32/build/smart_parking_esp32_merged.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 /workspace/firmware/esp32/build/bootloader/bootloader.bin 0x8000 /workspace/firmware/esp32/build/partition_table/partition-table.bin 0x10000 /workspace/firmware/esp32/build/smart_parking_esp32.bin && \
              echo '=== 2/2: Building Wokwi Standalone Demo Firmware (WOKWI_DEMO_ONLY) ===' && \
              idf.py -B build_demo -DSDKCONFIG_DEFAULTS=\"sdkconfig.defaults;sdkconfig.demo\" -DSDKCONFIG=build_demo/sdkconfig build 2>&1 | tee /workspace/firmware/esp32/build_compiler_demo.log && \
              esptool.py --chip esp32 merge_bin -o /workspace/firmware/esp32/build_demo/smart_parking_wokwi_demo_merged.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 /workspace/firmware/esp32/build_demo/bootloader/bootloader.bin 0x8000 /workspace/firmware/esp32/build_demo/partition_table/partition-table.bin 0x10000 /workspace/firmware/esp32/build_demo/smart_parking_esp32.bin && \
              cp /workspace/firmware/esp32/README_WOKWI_DEMO.txt /workspace/firmware/esp32/build_demo/ && \
              echo 'Both Production and Wokwi Demo builds completed successfully.'"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-build-compiler-log
          path: |
            firmware/esp32/build_compiler_prod.log
            firmware/esp32/build_compiler_demo.log
          if-no-files-found: ignore

      - name: Verify and list build artifacts
        run: |
          echo "=========================================="
          echo "ESP32 PRODUCTION BUILD ARTIFACTS VERIFICATION"
          echo "=========================================="
          ls -lah firmware/esp32/build/
          test -f firmware/esp32/build/smart_parking_esp32.bin && echo "[OK] Production smart_parking_esp32.bin exists"
          test -f firmware/esp32/build/smart_parking_esp32_merged.bin && echo "[OK] Production smart_parking_esp32_merged.bin exists"
          test -f firmware/esp32/build/smart_parking_esp32.elf && echo "[OK] Production smart_parking_esp32.elf exists"
          echo "=========================================="
          echo "WOKWI DEMO-ONLY BUILD ARTIFACTS VERIFICATION"
          echo "=========================================="
          ls -lah firmware/esp32/build_demo/
          test -f firmware/esp32/build_demo/smart_parking_esp32.bin && echo "[OK] Demo smart_parking_esp32.bin exists"
          test -f firmware/esp32/build_demo/smart_parking_wokwi_demo_merged.bin && echo "[OK] Demo smart_parking_wokwi_demo_merged.bin exists"
          test -f firmware/esp32/build_demo/smart_parking_esp32.elf && echo "[OK] Demo smart_parking_esp32.elf exists"
          test -f firmware/esp32/build_demo/README_WOKWI_DEMO.txt && echo "[OK] Demo README_WOKWI_DEMO.txt exists"
          echo "=========================================="

      - name: Upload Production Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: |
            firmware/esp32/build/smart_parking_esp32.bin
            firmware/esp32/build/smart_parking_esp32_merged.bin
            firmware/esp32/build/smart_parking_esp32.elf
            firmware/esp32/build/smart_parking_esp32.map
            firmware/esp32/build/flasher_args.json
            firmware/esp32/build/bootloader/bootloader.bin
            firmware/esp32/build/partition_table/partition-table.bin
            firmware/esp32/build_compiler_prod.log
          if-no-files-found: ignore

      - name: Upload Wokwi Demo-Only Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-wokwi-demo-only
          path: |
            firmware/esp32/build_demo/smart_parking_wokwi_demo_merged.bin
            firmware/esp32/build_demo/smart_parking_esp32.bin
            firmware/esp32/build_demo/smart_parking_esp32.elf
            firmware/esp32/build_demo/flasher_args.json
            firmware/esp32/build_demo/README_WOKWI_DEMO.txt
            firmware/esp32/build_compiler_demo.log
          if-no-files-found: ignore

  regression-tests:
    name: Full System Regression Tests (Backend, Vision & Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install opencv-python numpy pytest httpx anyio

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
